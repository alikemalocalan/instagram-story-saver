name: Build Native ARM64 (On-Demand)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the ARM64 bundle to (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-arm64-native:
    # Use GitHub's native ARM64 runner (Graviton / Neoverse) - 50x faster than QEMU emulation!
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Build Fat JAR
        run: |
          sbt assembly
          cp target/out/jvm/scala-3.3.8/instastorysaver/instastorysaver.jar ./instastorysaver.jar

      - name: Build self-contained Linux ARM64 Native Image
        run: |
          docker build \
            --file Dockerfile.arm64 \
            --output type=local,dest=. \
            .
          zip -r instastorysaver-linux-arm64.zip instastorysaver-linux-arm64

      - name: Attach ARM64 bundle to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: instastorysaver-linux-arm64.zip

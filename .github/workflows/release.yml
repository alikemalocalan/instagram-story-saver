name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (if manually triggered)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release-jar:
    name: Build Fat JAR & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Build assembly Fat JAR
        run: |
          sbt assembly
          JAR_PATH=$(find target -type f -name "instastorysaver.jar" | head -n 1)
          cp -f "$JAR_PATH" ./instastorysaver.jar

      - name: Publish GitHub Release (Fast)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: instastorysaver.jar
          generate_release_notes: true

  build-macos-arm64:
    name: Build macOS ARM64 Native Image
    runs-on: macos-latest
    needs: [build-and-release-jar]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Build Fat JAR
        run: |
          sbt assembly
          JAR_PATH=$(find target -type f -name "instastorysaver.jar" | head -n 1)
          cp -f "$JAR_PATH" ./instastorysaver.jar

      - name: Build macOS ARM64 Native Binary
        run: |
          native-image \
            -J-Xmx5g \
            -H:+UnlockExperimentalVMOptions \
            --no-fallback \
            --report-unsupported-elements-at-runtime \
            -O3 \
            -march=armv8-a \
            -R:MinHeapSize=16m \
            -R:MaxHeapSize=64m \
            --strict-image-heap \
            -H:+StripDebugInfo \
            --enable-https \
            --enable-http \
            --install-exit-handlers \
            --initialize-at-build-time=org.slf4j,com.typesafe.config,android.org.json,okio \
            -jar instastorysaver.jar \
            -o instastorysaver

          chmod +x instastorysaver
          mkdir -p dist
          cp instastorysaver dist/instastorysaver-macos-arm64
          tar -czvf instastorysaver-macos-arm64.tar.gz -C dist instastorysaver-macos-arm64
          zip -j instastorysaver-macos-arm64.zip dist/instastorysaver-macos-arm64

      - name: Attach macOS ARM64 binary to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            instastorysaver-macos-arm64.tar.gz
            instastorysaver-macos-arm64.zip
            dist/instastorysaver-macos-arm64

  build-linux-arm64:
    name: Build Linux ARM64 Native Image
    runs-on: ubuntu-24.04-arm
    needs: [build-and-release-jar]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Build Fat JAR
        run: |
          sbt assembly
          JAR_PATH=$(find target -type f -name "instastorysaver.jar" | head -n 1)
          cp -f "$JAR_PATH" ./instastorysaver.jar

      - name: Build self-contained Linux ARM64 Native Image
        run: |
          docker build \
            --file Dockerfile.arm64 \
            --output type=local,dest=. \
            .
          zip -r instastorysaver-linux-arm64.zip instastorysaver-linux-arm64

      - name: Attach Linux ARM64 bundle to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: instastorysaver-linux-arm64.zip
